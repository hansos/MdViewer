<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    MdViewer application icon — simplified variant for 32 px and below.

    At 16 px a 9-unit body line is half a pixel and four of them turn into grey
    mush, so the small sizes get their own drawing rather than a downscale:
    one sheet instead of two, fewer and heavier bars, larger margins. This is
    the difference between a crisp taskbar icon and a smudge.
  -->
  <defs>
    <linearGradient id="tileSmall" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#4A87E8"/>
      <stop offset="1" stop-color="#1B4A9E"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="58" ry="58" fill="url(#tileSmall)"/>

  <rect x="64" y="60" width="128" height="140" rx="14" fill="#FFFFFF"/>

  <rect x="84" y="86" width="68" height="18" rx="9" fill="#2A67CE"/>

  <rect x="84" y="124" width="88" height="12" rx="6" fill="#A9BAD2"/>
  <rect x="84" y="152" width="60" height="12" rx="6" fill="#A9BAD2"/>
</svg>
