<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    MdViewer application icon — full-detail master (48 px and above).

    The idea is the product, not the file format: two stacked sheets for the
    multi-tab viewer, and the front one shown RENDERED — a heading bar in the
    app's accent above body lines — because preview is what this app is for.
    A raw "#" would have said "Markdown file"; this says "reads Markdown".

    Colours are the app's own accent tokens (Themes/Tokens.axaml), so the icon
    and the UI are the same blue.

    A simplified variant carries 32 px and below; see mdviewer-small.svg.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#4A87E8"/>
      <stop offset="1" stop-color="#1B4A9E"/>
    </linearGradient>
  </defs>

  <!-- App tile. A solid ground keeps the icon legible on any taskbar,
       light or dark, which a transparent-background sheet would not. -->
  <rect width="256" height="256" rx="58" ry="58" fill="url(#tile)"/>

  <!-- The second tab, peeking out up and to the right -->
  <rect x="92" y="52" width="104" height="136" rx="12" fill="#FFFFFF" opacity="0.42"/>

  <!-- The document in front -->
  <rect x="60" y="68" width="112" height="136" rx="13" fill="#FFFFFF"/>

  <!-- Rendered heading -->
  <rect x="78" y="88" width="60" height="13" rx="6.5" fill="#2A67CE"/>

  <!-- Body copy -->
  <rect x="78" y="118" width="76" height="9" rx="4.5" fill="#AEBED4"/>
  <rect x="78" y="136" width="76" height="9" rx="4.5" fill="#AEBED4"/>
  <rect x="78" y="154" width="76" height="9" rx="4.5" fill="#AEBED4"/>
  <rect x="78" y="172" width="44" height="9" rx="4.5" fill="#AEBED4"/>
</svg>
